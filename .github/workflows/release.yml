name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CI: "true"
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os_label }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
            os_label: macos-universal
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: nsis,msi
            os_label: windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and run frontend tests
        run: npx tsc --noEmit && npm test

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri bundles
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package macOS release assets
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p release-assets
          APP_PATH=$(find src-tauri/target -path "*/release/bundle/macos/Novelium.app" -type d | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" release-assets/Novelium-macos-universal.app.zip
          find src-tauri/target -path "*/release/bundle/dmg/*.dmg" -type f -exec cp {} release-assets/ \;
          ls -lh release-assets

      - name: Package Windows release assets
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Get-ChildItem -Path "src-tauri/target/*/release/bundle/nsis/*-setup.exe" | Copy-Item -Destination release-assets
          Get-ChildItem -Path "src-tauri/target/*/release/bundle/msi/*.msi" | Copy-Item -Destination release-assets
          Get-ChildItem release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novelium-${{ matrix.os_label }}
          path: release-assets/*

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
