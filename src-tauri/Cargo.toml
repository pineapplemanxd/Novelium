[package]
name = "novelium"
version = "0.1.0"
description = "Novelium — Native Desktop Novel Reader & Personal Library"
authors = ["Novelium Contributors"]
edition = "2021"

[lib]
name = "novelium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "gzip", "deflate", "brotli", "query"] }
scraper = "0.29"
ego-tree = "0.11"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
zip = { version = "9.5", default-features = false, features = ["deflate"] }
flate2 = "1"
roxmltree = "0.21"
quick-xml = "0.42"
pdf-extract = "0.12"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
base64 = "0.22"
sha2 = "0.10"
futures = "0.3"
regex = "1"

[dev-dependencies]
tempfile = "3"
